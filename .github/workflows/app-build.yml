# iPhone-only compile and test verification.
#
# Cheap source-contract audits run independently on Linux so macOS runner allocation cannot hide static
# regressions. The Xcode job starts only after every audit passes, then generates the project, builds the app
# and WidgetKit/Live Activity extension, and runs the complete iOS and retained-package test suites.
name: iOS build and tests

on:
  pull_request:
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'Packages/**'
      - 'Tools/qa/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  push:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'Packages/**'
      - 'Tools/qa/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CODEX_AUDIT_APPLY_BEGIN
  apply-audit-and-verify:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'design/whoop-unified-ui-20260821' }}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/whoop-unified-ui-20260821
          fetch-depth: 0

      - name: Rebuild and verify audit bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib
          parts = [pathlib.Path(p) for p in sorted(glob.glob('.codex/noop-audit-2026-08-27.part*'))]
          if len(parts) != 7:
              raise SystemExit(f'expected 7 audit parts, found {len(parts)}')
          encoded = ''.join(p.read_text() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = '0569e65d55d2619cf5a1e2246e5ca3f748293912d73fc391fcc33403ae20b83c'
          if digest != expected:
              raise SystemExit(f'audit bundle hash mismatch: {digest}')
          pathlib.Path('/tmp/noop-audit.zip').write_bytes(data)
          print(f'audit bundle verified: {digest}')
          PY
          bundle_root="$(mktemp -d)"
          patch_parent="$(mktemp -d)"
          patch_worktree="$patch_parent/worktree"
          unzip -q /tmp/noop-audit.zip -d "$bundle_root"
          bundle="$bundle_root/noop-main-ab4617-production-audit-2026-08-27"
          python3 "$bundle/tools/validate_package.py"
          git worktree add --detach "$patch_worktree" ab4617d6e0df1ead7c68fcf9eea2ed84709f64a0
          python3 "$bundle/tools/apply_noop_audit_fixes.py" "$patch_worktree" --check
          python3 "$bundle/tools/apply_noop_audit_fixes.py" "$patch_worktree" --apply
          python3 - "$bundle/evidence/PATCH_MANIFEST.json" "$patch_worktree" "$GITHUB_WORKSPACE" <<'PY'
          import json, pathlib, shutil, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          src_root = pathlib.Path(sys.argv[2])
          dst_root = pathlib.Path(sys.argv[3])
          paths = []
          for operation in manifest['operations']:
              rel = operation['path']
              if rel not in paths:
                  paths.append(rel)
          for rel in manifest['adds']:
              if rel not in paths:
                  paths.append(rel)
          for rel in paths:
              if rel == '.github/workflows/app-build.yml':
                  continue
              src = src_root / rel
              dst = dst_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          for rel in manifest['deletes']:
              target = dst_root / rel
              if target.exists():
                  target.unlink()
          PY

      - name: Remove temporary executor and preserve both audit gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import glob
          p = Path('.github/workflows/app-build.yml')
          s = p.read_text()
          start_marker = '  # CODEX_AUDIT_APPLY_BEGIN\n'
          end_marker = '  # CODEX_AUDIT_APPLY_END\n'
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          s = s[:start] + s[end:]
          privacy = '            privacy_artifact_contract_audit.py\n'
          anchor = '            healthkit_sync_contract_audit.py\n'
          if privacy not in s:
              if anchor not in s:
                  raise SystemExit('healthkit audit anchor missing')
              s = s.replace(anchor, anchor + privacy, 1)
          p.write_text(s)
          for name in glob.glob('.codex/noop-audit-2026-08-27.part*'):
              Path(name).unlink()
          PY

      - name: Run all source and audit regressions
        shell: bash
        run: |
          set -euo pipefail
          audits=(
            source_contract_audit.py
            ui_unification_contract_audit.py
            whoop_ui_contract_audit.py
            workout_runtime_contract_audit.py
            workout_persistence_contract_audit.py
            trends_snapshot_contract_audit.py
            accessibility_localization_contract_audit.py
            healthkit_sync_contract_audit.py
            privacy_artifact_contract_audit.py
          )
          for audit in "${audits[@]}"; do
            python3 "Tools/qa/$audit"
          done
          git add -A
          test -z "$(git ls-files 'outputs/**/raw-extraction/*')"
          git diff --cached --check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and build iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run iOS tests
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')
          xcodebuild \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Run retained packages and focused audit tests
        shell: bash
        run: |
          set -euo pipefail
          for package in NoopPhase34Core WhoopProtocol OuraProtocol WhoopStore StrandAnalytics StrandImport StrandDesign NoopLocalAccess; do
            swift test --package-path "Packages/$package"
          done
          swift test --package-path Packages/WhoopProtocol --filter Whoop5RawOpticalTests
          swift test --package-path Packages/NoopPhase34Core --filter BatteryEstimatorTests
          swift test --package-path Packages/StrandDesign --filter DeviceCommandSystemsSummaryTests

      - name: Commit verified root-cause fixes to UI branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix production audit root causes"
          git push origin HEAD:design/whoop-unified-ui-20260821
  # CODEX_AUDIT_APPLY_END

  source-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run all focused source audits
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p qa-artifacts/audits
          status=0
          audits=(
            source_contract_audit.py
            ui_unification_contract_audit.py
            whoop_ui_contract_audit.py
            workout_runtime_contract_audit.py
            workout_persistence_contract_audit.py
            trends_snapshot_contract_audit.py
            accessibility_localization_contract_audit.py
            healthkit_sync_contract_audit.py
          )
          for audit in "${audits[@]}"; do
            echo "::group::$audit"
            python3 "Tools/qa/$audit" 2>&1 | tee "qa-artifacts/audits/${audit%.py}.txt"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if (( rc != 0 )); then status=1; fi
          done
          exit "$status"

      - name: Upload source-audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-logs-${{ github.sha }}
          path: qa-artifacts/audits
          if-no-files-found: error
          retention-days: 30

  build-and-test:
    needs: source-audits
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          xcodebuild -version | tee qa-artifacts/xcode-version.txt
          swift --version | tee qa-artifacts/swift-version.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee qa-artifacts/xcodegen.txt

      - name: Build iPhone app and extensions
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee qa-artifacts/xcodebuild-build.txt

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available | tee qa-artifacts/available-simulators.txt
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -F "$udid" | tee qa-artifacts/selected-simulator.txt

      - name: Run NOOPiOSTests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee qa-artifacts/xcodebuild-test.txt

      - name: Run retained Swift package tests
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p qa-artifacts/packages
          status=0
          for package in NoopPhase34Core WhoopProtocol OuraProtocol WhoopStore StrandAnalytics StrandImport StrandDesign NoopLocalAccess; do
            echo "::group::$package"
            swift test --package-path "Packages/$package" 2>&1 | tee "qa-artifacts/packages/$package.txt"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if (( rc != 0 )); then status=1; fi
          done
          echo "::group::NoopPhase34Core standalone"
          swift test --package-path Packages/NoopPhase34Core 2>&1 | tee qa-artifacts/packages/NoopPhase34Core-standalone.txt
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if (( rc != 0 )); then status=1; fi
          exit "$status"

      - name: Upload Xcode and package logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-test-logs-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 30
