name: iOS app build and tests

on:
  pull_request:
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  push:
    branches:
      - main
      - refactor/ios-only-qa-2026-07-22
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NOOPiOS and extensions
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$({ xcrun simctl list devices available -j || true; } | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          for runtime, devices in payload.get("devices", {}).items():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator was found")
          ')"
          echo "destination=platform=iOS Simulator,id=${udid}" >> "$GITHUB_OUTPUT"

      - name: Run NOOPiOSTests
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination '${{ steps.simulator.outputs.destination }}'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

  cleanup:
    needs: [ios]
    if: ${{ always() && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the disposable CI branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" || true
