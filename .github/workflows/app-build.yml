# iPhone-only compile and test verification.
#
# Cheap source-contract audits run independently on Linux so macOS runner allocation cannot hide static
# regressions. The Xcode job starts only after every audit passes, then generates the project, builds the app
# and WidgetKit/Live Activity extension, and runs the complete iOS and retained-package test suites.
# `.gitignore` and `Tools/linux-capture/**` are watched so the hygiene audit's private-capture rule runs on
# the changes it exists to catch.
name: iOS build and tests

on:
  pull_request:
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'StrandiOSUITests/**'
      - 'Packages/**'
      - 'Tools/qa/**'
      - 'Tools/linux-capture/**'
      - '.gitignore'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
      - '.github/ISSUE_TEMPLATE/bug_report.yml'
  push:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'StrandiOSUITests/**'
      - 'Packages/**'
      - 'Tools/qa/**'
      - 'Tools/linux-capture/**'
      - '.gitignore'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
      - '.github/ISSUE_TEMPLATE/bug_report.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install source-audit dependencies
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check \
            --target "$RUNNER_TEMP/noop-source-audit-python" 'PyYAML==6.0.3'

      - name: Run all focused source audits
        shell: bash
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ runner.temp }}/noop-source-audit-python
        run: |
          set -uo pipefail
          mkdir -p qa-artifacts/audits
          status=0
          audits=(
            source_contract_audit.py
            ui_unification_contract_audit.py
            whoop_ui_contract_audit.py
            workout_runtime_contract_audit.py
            workout_persistence_contract_audit.py
            trends_snapshot_contract_audit.py
            accessibility_localization_contract_audit.py
            healthkit_sync_contract_audit.py
            privacy_artifact_contract_audit.py
            paper_strings_contract_audit.py
            project_hygiene_audit.py
            test_project_hygiene_audit.py
            test_bug_report_template.py
            whats_new_release_audit.py
            test_whats_new_release_audit.py
          )
          for audit in "${audits[@]}"; do
            echo "::group::$audit"
            # `shell: bash` runs with -e: a bare failing pipeline would end the step here and hide every later audit.
            if ! python3 "Tools/qa/$audit" 2>&1 | tee "qa-artifacts/audits/${audit%.py}.txt"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload source-audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-logs-${{ github.sha }}
          path: qa-artifacts/audits
          if-no-files-found: error
          retention-days: 30

  build-and-test:
    needs: source-audits
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          xcodebuild -version | tee qa-artifacts/xcode-version.txt
          swift --version | tee qa-artifacts/swift-version.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee qa-artifacts/xcodegen.txt

      - name: Verify source adoption preserves same-strap alarms
        shell: bash
        run: |
          set -o pipefail
          python3 Tools/qa/test_ble_clock_alarm_isolation.py 2>&1 | tee qa-artifacts/clock-alarm-isolation.txt

      - name: Verify confirmed deep-data queue leases
        shell: bash
        run: |
          set -o pipefail
          python3 Tools/qa/deep_data_confirmed_queue_harness.py 2>&1 | tee qa-artifacts/deep-data-confirmed-queue.txt

      - name: Verify BLE and foreground ownership regressions
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for regression in test_ble_data_range_integrity test_ble_response_diagnostics test_ble_connection_result_ownership pending_intents_lifecycle_harness widget_published_assignment_harness; do
            echo "::group::$regression"
            if ! python3 "Tools/qa/$regression.py" 2>&1 | tee "qa-artifacts/$regression.txt"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Build iPhone app and extensions
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee qa-artifacts/xcodebuild-build.txt

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available | tee qa-artifacts/available-simulators.txt
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -F "$udid" | tee qa-artifacts/selected-simulator.txt

      - name: Run NOOPiOSTests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee qa-artifacts/xcodebuild-test.txt

      - name: Run routine and selected-screen UI regressions
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme NOOPCoachUI \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:NOOPCoachUITests/LiftRoutineSelectionTests \
            -only-testing:NOOPCoachUITests/SelectedScreenDirectionTests \
            -only-testing:NOOPCoachUITests/CoachKeyboardLayoutTests \
            -only-testing:NOOPCoachUITests/NotificationSettingsUITests \
            -only-testing:NOOPCoachUITests/NotificationDestinationUITests \
            -only-testing:NOOPCoachUITests/ApprovedDashboardUITests/testSharedBatteryHeaderAndRecentUpdatesNormal \
            -only-testing:NOOPCoachUITests/ApprovedDashboardUITests/testSharedBatteryHeaderAndRecentUpdatesAccessibilityXXXL \
            -only-testing:NOOPCoachUITests/ApprovedDashboardUITests \
            -resultBundlePath qa-artifacts/selected-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee qa-artifacts/selected-ui.txt

      - name: Run retained Swift package tests
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p qa-artifacts/packages
          status=0
          for package in NoopPhase34Core WhoopProtocol OuraProtocol WhoopStore StrandAnalytics StrandImport StrandDesign NoopLocalAccess; do
            echo "::group::$package"
            # `shell: bash` runs with -e: a bare failing pipeline would end the step here and hide every later package.
            if ! swift test --package-path "Packages/$package" 2>&1 | tee "qa-artifacts/packages/$package.txt"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload Xcode and package logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-test-logs-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 30
