# iPhone-only compile and test verification.
#
# The repository intentionally targets iOS only. This workflow performs a cheap source-contract audit,
# generates the Xcode project, builds the app and WidgetKit/Live Activity extension, and runs the complete
# iOS test target. Signing is disabled; no credentials or release artifacts are used.
name: iOS build and tests

on:
  pull_request:
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'Packages/**'
      - 'Tools/qa/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  push:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'Packages/**'
      - 'Tools/qa/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit iPhone source contracts
        run: python3 Tools/qa/source_contract_audit.py

      - name: Audit unified Trends, alarm, Settings, and More contracts
        run: python3 Tools/qa/ui_unification_contract_audit.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app and extensions
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run NOOPiOSTests
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

      - name: Run Swift package tests
        shell: bash
        run: |
          set -euo pipefail
          for package in WhoopProtocol WhoopStore OuraProtocol StrandAnalytics StrandImport StrandDesign; do
            echo "::group::$package"
            swift test --package-path "Packages/$package"
            echo "::endgroup::"
          done
