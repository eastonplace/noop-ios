# TEMPORARY one-shot repair run for PR #9. The Linux job restores the normal workflow before it
# commits, so the branch is left with the standard iPhone build/test configuration.
name: iOS build and tests

on:
  pull_request:
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'StrandiOSTests/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/ios-only-production-qa-2026-07-22
          fetch-depth: 0

      - name: Apply remaining compile and refresh fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, value: str) -> None:
              Path(path).write_text(value)

          def replace_exact(value: str, old: str, new: str, count: int, label: str) -> str:
              actual = value.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: expected {count} match(es), found {actual}")
              return value.replace(old, new)

          path = 'Strand/Data/BehaviorStore.swift'
          value = read(path).replace('MacActionKind', 'DeviceActionKind')
          value = value.replace('Double-tap → Mac action', 'Double-tap action')
          write(path, value)

          path = 'Strand/Screens/AutomationsView.swift'
          value = read(path).replace('MacActionKind', 'DeviceActionKind')
          value = value.replace('runMacAction', 'runDeviceAction')
          write(path, value)

          path = 'Strand/App/AppModel.swift'
          value = read(path).replace('MacActionKind', 'DeviceActionKind')
          value = value.replace('MacActions', 'DeviceActions')
          value = value.replace('runMacAction', 'runDeviceAction')

          value = replace_exact(
              value,
              '            if let route { RouteStore.store(route, startTs: saved.startTs, sport: saved.sport) }\n            await repo.refresh()\n            lastWorkout = saved',
              '            if let route { RouteStore.store(route, startTs: saved.startTs, sport: saved.sport) }\n            _ = await repo.refresh(.currentDay)\n            lastWorkout = saved',
              1,
              'workout final refresh'
          )
          value = replace_exact(
              value,
              '            await self.repo.refresh()                          // surface any imported data at once',
              '            _ = await self.repo.refresh(.initialLoad)          // surface imported history once',
              1,
              'initial refresh'
          )
          value = replace_exact(
              value,
              '        live.append(log: "Read spine re-pointed to active device after registry change (#814).")\n        await repo.refresh()\n        await intelligence.analyzeRecent()',
              '        live.append(log: "Read spine re-pointed to active device after registry change (#814).")\n        _ = await repo.refresh(.activeDeviceChanged)\n        await intelligence.analyzeRecent()',
              1,
              'active-device refresh'
          )
          value = replace_exact(
              value,
              '        await repo.refresh(days: 120)\n        await refreshV5Signals()',
              '        _ = await repo.refresh(.postBackfill)\n        await refreshV5Signals()',
              1,
              'backfill refresh'
          )
          value = replace_exact(
              value,
              '                try? await store.checkpointWAL()   // reclaim the WAL a bulk import grew (#590)\n                await repo.refresh()',
              '                try? await store.checkpointWAL()   // reclaim the WAL a bulk import grew (#590)\n                _ = await repo.refresh(.postImport)',
              3,
              'post-import refreshes'
          )
          write(path, value)

          path = 'Strand/Screens/LiveWorkoutView.swift'
          value = replace_exact(read(path), 'model.endWorkoutOptimized()', 'model.endWorkout()', 1,
                                'workout finish call')
          write(path, value)
          Path('Strand/App/AppModel+WorkoutFinish.swift').unlink()

          path = 'StrandiOS/App/RootTabView.swift'
          value = replace_exact(read(path),
                                '                Task { await repo.refresh() }',
                                '                Task { _ = await repo.refresh(.currentDay) }',
                                1,
                                'tab reselect refresh')
          value = replace_exact(value,
                                '        .task {\n            await repo.refresh()\n            // Backup & Sync:',
                                '        .task {\n            // AppModel owns the initial history load. This task only performs backup catch-up.\n            // Backup & Sync:',
                                1,
                                'duplicate RootTabView launch refresh')
          write(path, value)
          PY

          git diff --check
          echo 'Remaining zero-argument repository refreshes:'
          rg -n 'repo\.refresh\(\)' Strand StrandiOS || true
          echo 'Remaining deleted macOS action identifiers:'
          rg -n '\b(MacActionKind|MacActions|runMacAction)\b' Strand StrandiOS || true

      - name: Commit source repair and restore normal workflow
        shell: bash
        run: |
          set -euo pipefail
          git show 5b3898242d8c159ef5652eb2466637b918a0a48a:.github/workflows/app-build.yml > .github/workflows/app-build.yml
          git rm -f .github/workflows/pr9-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/app-build.yml Strand StrandiOS Packages
          git commit -m 'fix(iOS): finish compile repair and typed refresh migration'
          git push origin HEAD:perf/ios-only-production-qa-2026-07-22

  build-and-test:
    needs: apply-fixes
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repaired PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/ios-only-production-qa-2026-07-22

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app and extensions
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run NOOPiOSTests
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

      - name: Run Swift package tests
        shell: bash
        run: |
          set -euo pipefail
          for package in WhoopProtocol WhoopStore OuraProtocol StrandAnalytics StrandImport StrandDesign; do
            echo "::group::$package"
            swift test --package-path "Packages/$package"
            echo "::endgroup::"
          done
