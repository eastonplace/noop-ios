# Compile-and-test verification for the reusable Swift packages.
#
# This job tests reusable packages independently of the iPhone app. The packages
# build with plain SwiftPM — no Xcode project, signing, or secrets required.
name: Swift Packages CI

on:
  pull_request:
    branches: [main, staging/noop-ios-2.0]
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  workflow_dispatch:

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - WhoopProtocol
          - OuraProtocol
          - WhoopStore
          - StrandAnalytics
          - StrandImport
          - StrandDesign
          - NoopLocalAccess
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}
