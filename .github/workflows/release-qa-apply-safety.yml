name: Apply release QA safety fixes
# Second-stage push trigger: the workflow now exists before this commit.

on:
  push:
    branches:
      - release/noop-ios-2.0
    paths:
      - .github/workflows/release-qa-apply-safety.yml

permissions:
  contents: write

concurrency:
  group: release-qa-safety-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@v4
        with:
          ref: release/noop-ios-2.0
          fetch-depth: 0

      - name: Apply and audit deterministic fixes
        id: patch
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 Tools/qa/apply_release_qa_alarm.py
          status=$?
          if (( status == 0 )); then python3 Tools/qa/apply_release_qa_trends.py || status=1; fi
          if (( status == 0 )); then python3 Tools/qa/apply_release_qa_backup.py || status=1; fi
          if (( status == 0 )); then git diff --check || status=1; fi
          if (( status == 0 )); then
            audits=(
              source_contract_audit.py
              ui_unification_contract_audit.py
              workout_runtime_contract_audit.py
              workout_persistence_contract_audit.py
              trends_snapshot_contract_audit.py
              accessibility_localization_contract_audit.py
              healthkit_sync_contract_audit.py
            )
            for audit in "${audits[@]}"; do
              python3 "Tools/qa/$audit" || status=1
            done
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit successful patch or clean failed transport
        shell: bash
        env:
          PATCH_STATUS: ${{ steps.patch.outputs.status }}
        run: |
          set -euo pipefail
          if [[ "$PATCH_STATUS" != "0" ]]; then
            git reset --hard HEAD
          fi
          git rm Tools/qa/release_qa_patch_common.py
          git rm Tools/qa/apply_release_qa_alarm.py
          git rm Tools/qa/apply_release_qa_trends.py
          git rm Tools/qa/apply_release_qa_backup.py
          git rm .github/workflows/release-qa-apply-safety.yml
          git add -A
          if [[ "$PATCH_STATUS" == "0" ]]; then
            git commit -m "fix(release): harden alarm, trends, and backup QA"
          else
            git commit -m "chore(ci): remove failed release QA transport"
          fi
          git push origin HEAD:release/noop-ios-2.0
          test "$PATCH_STATUS" = "0"
