name: iOS-only repository audit

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate repository and platform-reference audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          find . -path './.git' -prune -o -type f -print \
            | sed 's#^./##' \
            | sort > audit/repository-file-manifest.txt

          {
            echo '# iOS-only platform reference audit'
            echo
            echo 'Generated from commit:' "$(git rev-parse HEAD)"
            echo
            echo '## References requiring review'
            rg -n --hidden \
              --glob '!.git/**' \
              --glob '!audit/**' \
              '(WatchSessionBridge|WatchRecovery|WatchScoreSnapshot|AppleWatch|watchOS|NOOPWatch|os\(macOS\)|canImport\(AppKit\)|import AppKit|NSApplication|MenuBarExtra|android/|Android)' \
              . || true
          } > audit/platform-reference-audit.txt

          {
            echo '# Portable QA'
            echo
            echo 'Swift:'
            swift --version
            echo
            for package in WhoopProtocol WhoopStore OuraProtocol StrandAnalytics StrandImport; do
              echo "## $package"
              if timeout 8m swift test --package-path "Packages/$package"; then
                echo 'RESULT: PASS'
              else
                echo 'RESULT: FAIL'
              fi
              echo
            done
          } > audit/portable-qa.txt 2>&1

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-only-repository-audit
          path: audit
          if-no-files-found: error
          retention-days: 7
