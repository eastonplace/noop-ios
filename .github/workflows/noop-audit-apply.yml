name: One-shot NOOP production audit apply

# Triggered 2026-08-29 to finish the verified root-cause repair set on the WHOOP UI branch.
on:
  push:
    branches:
      - design/whoop-unified-ui-20260821
    paths:
      - '.github/workflows/noop-audit-apply.yml'

permissions:
  contents: write

concurrency:
  group: noop-audit-apply
  cancel-in-progress: false

jobs:
  apply-audit-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact UI branch
        uses: actions/checkout@v4
        with:
          ref: design/whoop-unified-ui-20260821
          fetch-depth: 0

      - name: Verify audited source fingerprints
        run: python3 .github/audit-apply.py . --check

      - name: Apply exact root-cause patch
        run: python3 .github/audit-apply.py . --apply

      - name: Run source contracts
        shell: bash
        run: |
          set -euo pipefail
          for audit in \
            source_contract_audit.py \
            ui_unification_contract_audit.py \
            whoop_ui_contract_audit.py \
            workout_runtime_contract_audit.py \
            workout_persistence_contract_audit.py \
            trends_snapshot_contract_audit.py \
            accessibility_localization_contract_audit.py \
            healthkit_sync_contract_audit.py \
            privacy_artifact_contract_audit.py; do
            python3 "Tools/qa/$audit"
          done
          test -z "$(git ls-files 'outputs/**/raw-extraction/*')" || {
            echo 'Tracked raw-extraction artifacts remain after audit patch.' >&2
            exit 1
          }
          git diff --check

      - name: Remove one-shot helper and workflow
        run: git rm .github/audit-apply.py .github/workflows/noop-audit-apply.yml

      - name: Commit verified audit repairs to UI branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix production audit root causes'
          git push origin HEAD:design/whoop-unified-ui-20260821
