name: iOS-only source audit

on:
  pull_request:
  push:
    branches:
      - refactor/ios-only-qa-2026-07-22
  workflow_dispatch:

concurrency:
  group: ios-only-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify iOS-only product boundary
        run: bash scripts/verify-ios-only.sh
