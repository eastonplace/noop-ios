name: Manual Sleep Window Recovery QA

on:
  pull_request:
    branches:
      - release/noop-ios-2.1
    paths:
      - .github/workflows/manual-sleep-window-recovery.yml
      - Tools/apply_manual_sleep_recovery.py
      - Packages/StrandAnalytics/**
      - Packages/WhoopStore/**
      - Strand/Data/**
      - Strand/Screens/**
      - StrandiOSTests/**
      - project.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: manual-sleep-window-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-and-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/manual-sleep-window-recovery'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic cross-file patch
        run: python3 Tools/apply_manual_sleep_recovery.py

      - name: Check generated diff
        run: |
          git diff --check
          git status --short

      - name: Test StrandAnalytics
        run: swift test --package-path Packages/StrandAnalytics

      - name: Test WhoopStore
        run: swift test --package-path Packages/WhoopStore

      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -version

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], text=True))
          preferred = []
          fallback = []
          for runtime, devices in payload.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if not device.get('isAvailable') or not device.get('name', '').startswith('iPhone'):
                      continue
                  fallback.append(device)
                  if any(model in device['name'] for model in ('iPhone 16 Pro', 'iPhone 16', 'iPhone 15 Pro')):
                      preferred.append(device)
          choice = (preferred or fallback)[0]
          print(choice['udid'])
          PY
          )
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build and test NOOP iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee /tmp/noop-xcodebuild.log

      - name: Commit generated implementation
        if: success()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already committed; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Packages/WhoopStore/Sources/WhoopStore/WhoopStore.swift \
            Packages/WhoopStore/Sources/WhoopStore/Database.swift \
            Packages/WhoopStore/Sources/WhoopStore/DeviceRegistryStore.swift \
            Packages/WhoopStore/Tests/WhoopStoreTests/MetricsCacheTests.swift \
            Strand/Data/Repository.swift \
            Strand/Data/IntelligenceEngine.swift \
            Strand/Screens/SleepView.swift
          git commit -m "Wire manual sleep window recovery end to end"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-sleep-window-xcode-log
          path: /tmp/noop-xcodebuild.log
          if-no-files-found: ignore
